description: >-
  Attentive publishes NO prices. The pricing page names a set of channel packages and AI
  add-on packages but attaches no dollar figure, no currency, no billing period and no
  included quota to any of them: every package routes to a "Get a demo" / contact-sales
  form. Attentive states pricing is "tailored to your business needs based on your message
  volume, subscriber list size, number of channels, and AI products selected", and that
  customers "only pay for what you actually use - no credit system required", with discounts
  for bundling channels or premium AI products. There is no self-serve signup, no free tier
  and no published API-usage pricing - the APIs are included with a platform contract rather
  than metered separately.
notes: >-
  plan_count is 0 because zero PRICED plans are published, not because the page is empty.
  The named packages below are recorded with price null so the shape of the commercial
  offer is captured honestly. API rate limits are published separately and are captured in
  rate-limits/attentive-rate-limits.yml - they are technical limits, not plan entitlements.
