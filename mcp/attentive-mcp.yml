note: >-
  UPDATED 2026-08-13. A live remote MCP endpoint answers on Attentive's own docs host at
  https://docs.attentive.com/mcp. It speaks MCP JSON-RPC: POST tools/list returns
  {"jsonrpc":"2.0","error":{"code":-32001,"message":"Authorization required"}} (HTTP 401) and
  GET returns the plain-text body "This URL can only be accessed with a MCP client." So the
  surface is real and reachable, but the live tool list is AUTH-GATED and could not be read
  anonymously. ATTRIBUTION CAVEAT: this endpoint is served by the ReadMe documentation
  platform (x-render-origin-server: Render), which exposes the hosted project's API reference
  as MCP tools; the same 401 shape appears on other ReadMe-hosted developer portals, and
  docs.readme.com/mcp itself answers 200 with generic docs tools. It is therefore a
  platform-provided MCP surface on Attentive's domain, gated by Attentive's own API token -
  NOT an Attentive-built first-party server. The tools[] list below remains DERIVED from the
  OpenAPI operations (one candidate tool per operationId) and is not the server's real
  tools/list response.
